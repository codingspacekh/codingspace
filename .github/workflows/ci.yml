# CI gates (03 §10.3). A red job blocks the merge (branch protection on main).
# Third-party actions are pinned to commit SHAs (public repo: protects against tag hijacking).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Audit · types · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

  database:
    name: Database (pgTAP RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The API (PostgREST behind Kong) is needed for the content import test; the rest is skipped.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,storage-api,postgres-meta
      - run: supabase test db
      # Content import and the page data layer against the local database (job name kept: it is a required check).
      - name: Integration tests (content import, page data)
        run: |
          set -a; eval "$(scripts/local-db-env.sh)"; set +a
          npm run test:int

  e2e:
    name: E2E (Playwright + axe, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Pages are built from the database: start a local Supabase and load content/ into it.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,storage-api,postgres-meta
      - run: scripts/local-db-env.sh >> "$GITHUB_ENV"
      - run: npm run content:import
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (lab budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lighthouse/package-lock.json
      - run: npm ci
      # Lighthouse CI has its own lockfile, outside the app's dependencies (see tools/lighthouse/package.json).
      - run: npm ci --prefix tools/lighthouse --ignore-scripts
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,storage-api,postgres-meta
      - run: scripts/local-db-env.sh >> "$GITHUB_ENV"
      - run: npm run content:import
      # Indexable build: before launch every page is noindex, which Lighthouse's SEO score fails by design.
      - run: npm run build
        env:
          SITE_INDEXABLE: 'true'
      - run: tools/lighthouse/node_modules/.bin/lhci autorun --config=tools/lighthouse/lighthouserc.cjs
        env:
          SITE_INDEXABLE: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true # the folder name starts with a dot
          retention-days: 14

  react19:
    name: React 19 compatibility (informational, ADR 0001)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps react@19.1.0 react-dom@19.1.0 @types/react@19.1.2 @types/react-dom@19.1.2
      - run: node patches/apply-arwes-patch.mjs
      # Pages are built from the database: start a local Supabase and load content/ into it.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,storage-api,postgres-meta
      - run: scripts/local-db-env.sh >> "$GITHUB_ENV"
      - run: npm run content:import
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
