<p>A <em>linear search</em> checks each item in turn. In 9618 pseudocode:</p><figure class="code" data-lang="text"><div class="code-head"><span class="code-lang">Pseudocode</span><button type="button" class="code-copy">Copy</button></div><pre class="shiki github-dark-default" style="background-color:#0d1117;color:#e6edf3" tabindex="0"><code><span class="line"><span>FOR Index ← 1 TO 10</span></span>
<span class="line"><span>    IF Items[Index] = Target THEN</span></span>
<span class="line"><span>        RETURN Index</span></span>
<span class="line"><span>    ENDIF</span></span>
<span class="line"><span>NEXT Index</span></span></code></pre></figure><h2 id="in-python">In Python</h2><figure class="code" data-lang="python"><div class="code-head"><span class="code-lang">Python</span><button type="button" class="code-copy">Copy</button></div><pre class="shiki github-dark-default" style="background-color:#0d1117;color:#e6edf3" tabindex="0"><code><span class="line"><span style="color:#FF7B72">def</span><span style="color:#D2A8FF"> linear_search</span><span style="color:#E6EDF3">(items, target):</span></span>
<span class="line"><span style="color:#FF7B72">    for</span><span style="color:#E6EDF3"> i, item </span><span style="color:#FF7B72">in</span><span style="color:#79C0FF"> enumerate</span><span style="color:#E6EDF3">(items):</span></span>
<span class="line"><span style="color:#FF7B72">        if</span><span style="color:#E6EDF3"> item </span><span style="color:#FF7B72">==</span><span style="color:#E6EDF3"> target:</span></span>
<span class="line"><span style="color:#FF7B72">            return</span><span style="color:#E6EDF3"> i</span></span>
<span class="line"><span style="color:#FF7B72">    return</span><span style="color:#FF7B72"> -</span><span style="color:#79C0FF">1</span></span></code></pre></figure><aside class="callout callout--exam-tip" role="note"><p class="callout-label">Exam tip</p><p>Arrays in pseudocode start at <code>1</code> unless the question says otherwise.</p></aside><ul><li><p>Best case: O(1)</p></li><li><p>Worst case: O(n)</p></li></ul><div class="table-wrap" tabindex="0"><table><thead><tr><th scope="col">Case</th><th scope="col">Comparisons</th></tr></thead><tbody><tr><td>Best</td><td>1</td></tr><tr><td>Worst</td><td>n</td></tr></tbody></table></div>
