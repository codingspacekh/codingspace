<h2 id="projectile-motion">Projectile motion</h2><p>Horizontal and vertical motion are independent. The range is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="true"><mfrac><mrow><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi></mrow><mi>g</mi></mfrac></mstyle></mrow><annotation encoding="application/x-tex">R = \dfrac{u^2 \sin 2\theta}{g}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:2.3715em;vertical-align:-0.8804em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.4911em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">g</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal">u</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">sin</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.8804em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span>.</p><figure class="figure"><img src="https://files.codingspace.io/physics/projectile.png" alt="Parabolic path of a projectile" width="800" height="450" loading="lazy" decoding="async"><figcaption>Path at 45°</figcaption></figure><figure class="embed embed--desmos"><iframe src="https://www.desmos.com/calculator/k3hd7syx2q?embed" title="Interactive projectile" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-popups allow-presentation" allowfullscreen></iframe></figure><h3 id="simulate-it">Simulate it</h3><figure class="code" data-lang="javascript"><div class="code-head"><span class="code-lang">JavaScript</span><button type="button" class="code-copy">Copy</button></div><pre class="shiki github-dark-default" style="background-color:#0d1117;color:#e6edf3" tabindex="0"><code><span class="line"><span style="color:#FF7B72">const</span><span style="color:#D2A8FF"> range</span><span style="color:#FF7B72"> =</span><span style="color:#E6EDF3"> (</span><span style="color:#FFA657">u</span><span style="color:#E6EDF3">, </span><span style="color:#FFA657">theta</span><span style="color:#E6EDF3">, </span><span style="color:#FFA657">g</span><span style="color:#FF7B72"> =</span><span style="color:#79C0FF"> 9.81</span><span style="color:#E6EDF3">) </span><span style="color:#FF7B72">=></span><span style="color:#E6EDF3"> (u </span><span style="color:#FF7B72">**</span><span style="color:#79C0FF"> 2</span><span style="color:#FF7B72"> *</span><span style="color:#E6EDF3"> Math.</span><span style="color:#D2A8FF">sin</span><span style="color:#E6EDF3">(</span><span style="color:#79C0FF">2</span><span style="color:#FF7B72"> *</span><span style="color:#E6EDF3"> theta)) </span><span style="color:#FF7B72">/</span><span style="color:#E6EDF3"> g;</span></span></code></pre></figure><blockquote><p>Air resistance is ignored in this model.</p></blockquote><aside class="callout callout--warning" role="note"><p class="callout-label">Warning</p><p>Use radians in <code>Math.sin</code>.</p></aside><hr><p class="file-row"><a href="https://files.codingspace.io/physics/projectile-worksheet.pdf" rel="noopener"><span class="file-name">projectile-worksheet.pdf</span> <span class="file-size">240 KB</span></a></p><p>See also <a href="/posts/circular-motion">the next lesson</a>.</p>
